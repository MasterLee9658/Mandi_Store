      { id: 6, sku: 'Onion', date: '9/7/2026', month: 'Sep_26', supplier: 'GOKUL TRADERS', qty: 3555, pp: 52.00, matValue: 184860, labour: 1320, transport: 2474, purValue: 188654, status: 'Paid', matSold: 'Yes', paidAmt: 0, poId: '', utr: '' },
      { id: 7, sku: 'Onion', date: '9/14/2026', month: 'Sep_26', supplier: 'Sahayadri', qty: 5700, pp: 48.00, matValue: 273600, labour: 0, transport: 20520, purValue: 294120, status: 'Pending', matSold: 'Yes', paidAmt: 0, poId: '', utr: '' },
      { id: 8, sku: 'Onion', date: '9/17/2026', month: 'Sep_26', supplier: 'SMK TRADERS(Onion)', qty: 1925, pp: 48.00, matValue: 92400, labour: 372, transport: 0, purValue: 92772, status: 'Pending', matSold: 'Yes', paidAmt: 0, poId: '', utr: '' },
      { id: 9, sku: 'Onion', date: '9/18/2026', month: 'Sep_26', supplier: 'smk TRADERS(Onion)', qty: 2617, pp: 50.00, matValue: 130850, labour: 510, transport: 0, purValue: 131360, status: 'Pending', matSold: 'Yes', paidAmt: 0, poId: '', utr: '' },
      { id: 10, sku: 'Onion', date: '9/22/2026', month: 'Sep_26', supplier: 'Sahayadri', qty: 25880, pp: 0, matValue: 0, labour: 0, transport: 0, purValue: 0, status: 'Advance...', matSold: 'No', paidAmt: 0, poId: '', utr: '' }
    ];

    const RAW_SALES = [
      { id: 1, sku: 'Onion', date: '8/18/2026', month: 'Aug_26', poId: '1477917', buyer: 'Elite Vegetable', qty: 5300, sp: 43.00, saleVal: 227900, mode: 'Contract', status: 'Collected' },
      { id: 2, sku: 'Onion', date: '8/18/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 9360, sp: 44.50, saleVal: 416520, mode: '', status: '' },
      { id: 3, sku: 'Onion', date: '8/28/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 2298, sp: 49.83, saleVal: 114500, mode: '', status: '' },
      { id: 4, sku: 'Onion', date: '8/10/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 4077, sp: 29.24, saleVal: 119193, mode: '', status: '' },
      { id: 5, sku: 'Onion', date: '8/17/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 2398, sp: 29.23, saleVal: 70082, mode: '', status: '' },
      { id: 6, sku: 'Onion', date: '9/9/2026', month: 'Sep_26', poId: '', buyer: 'Ecom Chennai', qty: 3555, sp: 0, saleVal: 200520, mode: 'Contract', status: 'Collected' },
      { id: 7, sku: 'Onion', date: '9/9/2026', month: 'Sep_26', poId: '', buyer: 'Ecom Chennai', qty: 3555, sp: 0, saleVal: 200520, mode: 'Contract', status: 'Collected' },
      { id: 8, sku: 'Onion', date: '9/14/2026', month: 'Sep_26', poId: '', buyer: 'Elite Vegetable', qty: 5700, sp: 52.00, saleVal: 296400, mode: '', status: 'Pending' },
      { id: 9, sku: 'Onion', date: '9/17/2026', month: 'Sep_26', poId: '', buyer: 'SS Fresh vegetables k-50', qty: 1925, sp: 51.00, saleVal: 98175, mode: '', status: 'Pending' },
      { id: 10, sku: 'Onion', date: '9/18/2026', month: 'Sep_26', poId: '', buyer: 'Elite Vegetable', qty: 2617, sp: 51.50, saleVal: 134776, mode: '', status: 'Pending' }
    ];

    const RAW_EXPENSES = [
      { id: 1, date: '8/18/2026', month: 'Aug_26', type: '-logistics', val: 12000 },
      { id: 2, date: '8/24/2026', month: 'Aug_26', type: '-Labour', val: 2300 }
    ];

    const formatCurrency = (val) => {
      if (val === undefined || val === null || isNaN(val)) return '₹0';
      return '₹' + Number(val).toLocaleString('en-IN');
    };

    const formatQty = (val) => {
      if (val === undefined || val === null || isNaN(val)) return '0';
      return Number(val).toLocaleString('en-IN');
    };

    const calculateAgeingDays = (dateStr) => {
      if (!dateStr) return 0;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return 0;
      const m = parseInt(parts[0], 10) - 1;
      const d = parseInt(parts[1], 10);
      const y = parseInt(parts[2], 10);
      
      const purchaseDate = new Date(y, m, d);
      const todayDate = new Date(2026, 8, 24);
      
      const diffTime = todayDate - purchaseDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      return diffDays >= 0 ? diffDays : 0;
    };

    function App() {
      const [selectedMonth, setSelectedMonth] = useState('All');
      const [selectedSku, setSelectedSku] = useState('All');
      const [activeTab, setActiveTab] = useState('inventory');
      const [searchTerm, setSearchTerm] = useState('');
      const [expandedRows, setExpandedRows] = useState([]);
      const [onlyAvailableStock, setOnlyAvailableStock] = useState(false);

      const toggleRowExpand = (id) => {
        setExpandedRows(prev =>
          prev.includes(id) ? prev.filter(rowId => rowId !== id) : [...prev, id]
        );
      };

      const filteredPurchases = useMemo(() => {
        return RAW_PURCHASES.filter(item => {
          const matchMonth = selectedMonth === 'All' || item.month === selectedMonth;
          const matchSku = selectedSku === 'All' || item.sku.toLowerCase() === selectedSku.toLowerCase();
          const matchSearch = searchTerm === '' || 
            item.supplier.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.poId && item.poId.includes(searchTerm));
          return matchMonth && matchSku && matchSearch;
        });
      }, [selectedMonth, selectedSku, searchTerm]);

      const filteredSales = useMemo(() => {
        return RAW_SALES.filter(item => {
          const matchMonth = selectedMonth === 'All' || item.month === selectedMonth;
          const matchSku = selectedSku === 'All' || item.sku.toLowerCase() === selectedSku.toLowerCase();
          const matchSearch = searchTerm === '' || 
            item.buyer.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.poId && item.poId.includes(searchTerm));
          return matchMonth && matchSku && matchSearch;
        });
      }, [selectedMonth, selectedSku, searchTerm]);

      const filteredExpenses = useMemo(() => {
        return RAW_EXPENSES.filter(item => {
          const matchMonth = selectedMonth === 'All' || item.month === selectedMonth;
          const matchSearch = searchTerm === '' || item.type.toLowerCase().includes(searchTerm.toLowerCase());
          return matchMonth && matchSearch;
        });
      }, [selectedMonth, searchTerm]);

      const supplierInventory = useMemo(() => {
        return filteredPurchases.map(pur => {
          let matchedSales = [];
          
          if (pur.poId && pur.poId.trim() !== '') {
            matchedSales = RAW_SALES.filter(s => s.poId && s.poId.trim() === pur.poId.trim());
          } else {
            matchedSales = RAW_SALES.filter(s => s.date === pur.date && s.sku === pur.sku && (!s.poId || s.poId.trim() === ''));
          }

          const totalSoldQty = matchedSales.reduce((sum, s) => sum + Number(s.qty || 0), 0);
          const totalSaleVal = matchedSales.reduce((sum, s) => sum + Number(s.saleVal || 0), 0);
          const availStock = Math.max(0, Number(pur.qty || 0) - totalSoldQty);
          const ageingDays = calculateAgeingDays(pur.date);

          const cogs = Number(pur.qty) > 0 ? (pur.purValue / pur.qty) * totalSoldQty : 0;
          const marginVal = totalSaleVal - cogs;
          const marginPct = totalSaleVal > 0 ? ((marginVal / totalSaleVal) * 100).toFixed(2) : '0.00';

          return {
            ...pur,
            soldQty: totalSoldQty,
            availStock: availStock,
            ageingDays: ageingDays,
            saleValue: totalSaleVal,
            margin: marginVal,
            marginPct: marginPct,
            matchedSales: matchedSales
          };
        });
      }, [filteredPurchases]);

      const totalPurchasedQty = useMemo(() => filteredPurchases.reduce((sum, p) => sum + Number(p.qty || 0), 0), [filteredPurchases]);
      const totalSoldQty = useMemo(() => filteredSales.reduce((sum, s) => sum + Number(s.qty || 0), 0), [filteredSales]);
      const totalAvailStock = useMemo(() => supplierInventory.reduce((sum, i) => sum + Number(i.availStock || 0), 0), [supplierInventory]);
      const totalPurchaseValue = useMemo(() => filteredPurchases.reduce((sum, p) => sum + Number(p.purValue || 0), 0), [filteredPurchases]);
      const totalSaleValue = useMemo(() => filteredSales.reduce((sum, s) => sum + Number(s.saleVal || 0), 0), [filteredSales]);
      
      const totalTradeMargin = useMemo(() => {
        return supplierInventory.reduce((sum, i) => sum + Number(i.margin || 0), 0);
      }, [supplierInventory]);

      const overallMarginPct = useMemo(() => {
        if (totalSaleValue === 0) return '0.00';
        return ((totalTradeMargin / totalSaleValue) * 100).toFixed(2);
      }, [totalTradeMargin, totalSaleValue]);

      const totalExpensesVal = useMemo(() => filteredExpenses.reduce((sum, e) => sum + Number(e.val || 0), 0), [filteredExpenses]);

      const ageingList = useMemo(() => {
        if (onlyAvailableStock) {
          return supplierInventory.filter(i => i.availStock > 0);
        }
        return supplierInventory;
      }, [supplierInventory, onlyAvailableStock]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-3 sm:p-6 lg:p-8">
          <div className="max-w-7xl mx-auto space-y-6">

            <header className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-4 border-b border-slate-200 bg-white p-5 rounded-2xl shadow-sm">
              <div>
                <div className="flex items-center gap-2">
                  <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider flex items-center gap-1">
                    <StoreIcon className="w-3.5 h-3.5" /> Mandi Business Store
                  </span>
                  <span className="bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-0.5 rounded-full text-xs font-semibold">
                    Today: 24th Sep 2026
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-bold mt-1 text-slate-900 tracking-tight">
                  Mandi Business Dashboard
                </h1>
                <p className="text-xs sm:text-sm text-slate-500 mt-0.5">
                  Available Inventory, Stock Ageing, Sales Value, Trade Margins & Expenses
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <div className="flex items-center gap-1.5 bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl">
                  <CalendarIcon className="w-4 h-4 text-emerald-600 shrink-0" />
                  <span className="text-xs text-slate-500 font-medium">Month:</span>
                  <select
                    value={selectedMonth}
                    onChange={(e) => setSelectedMonth(e.target.value)}
                    className="bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer"
                  >
                    <option value="All">All Months</option>
                    <option value="Aug_26">Aug_26</option>
                    <option value="Sep_26">Sep_26</option>
                  </select>
                </div>

                <div className="flex items-center gap-1.5 bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl">
                  <TagIcon className="w-4 h-4 text-amber-600 shrink-0" />

                  <select
                    value={selectedSku}
                    onChange={(e) => setSelectedSku(e.target.value)}
                    className="bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer"
                  >
                    <option value="All">All SKUs</option>
                    <option value="Onion">Onion</option>
                    <option value="Garlic">Garlic</option>
                  </select>
                </div>

                <div className="relative">
                  <SearchIcon className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                  <input
                    type="text"
                    placeholder="Search supplier, buyer, PO..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="bg-slate-100 border border-slate-200 text-xs text-slate-800 rounded-xl pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 w-40 sm:w-52 font-medium"
                  />
                </div>
              </div>
            </header>

            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
              <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex items-center justify-between text-slate-500 text-[11px] font-semibold uppercase tracking-wider">
                  <span>Available Stock</span>
                  <PackageIcon className="w-4 h-4 text-emerald-600" />
                </div>
                <p className="text-xl sm:text-2xl font-bold text-slate-900 mt-1 font-mono">
                  {formatQty(totalAvailStock)} <span className="text-xs font-normal text-slate-500">Kg</span>
                </p>
                <p className="text-[11px] text-slate-500 mt-1">Purchased: {formatQty(totalPurchasedQty)}</p>
              </div>

              <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex items-center justify-between text-slate-500 text-[11px] font-semibold uppercase tracking-wider">
                  <span>Sold Stock</span>
                  <ShoppingBagIcon className="w-4 h-4 text-blue-600" />
                </div>
                <p className="text-xl sm:text-2xl font-bold text-blue-600 mt-1 font-mono">
                  {formatQty(totalSoldQty)} <span className="text-xs font-normal text-slate-500">Kg</span>
                </p>
                <p className="text-[11px] text-slate-500 mt-1">Total Sold Quantity</p>
              </div>

              <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex items-center justify-between text-slate-500 text-[11px] font-semibold uppercase tracking-wider">
                  <span>Sale Value</span>
                  <ArrowUpRightIcon className="w-4 h-4 text-emerald-600" />
                </div>
                <p className="text-lg sm:text-xl font-bold text-emerald-600 mt-1 font-mono">
                  {formatCurrency(totalSaleValue)}
                </p>
                <p className="text-[11px] text-slate-500 mt-1">Gross Sales Revenue</p>
              </div>

              <div className="bg-emerald-50/50 border border-emerald-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex items-center justify-between text-emerald-800 text-[11px] font-semibold uppercase tracking-wider">
                  <span>Trade Margin</span>
                  <TrendingUpIcon className="w-4 h-4 text-emerald-600" />
                </div>
                <p className="text-lg sm:text-xl font-bold text-emerald-700 mt-1 font-mono">
                  {formatCurrency(totalTradeMargin)}
                </p>
                <p className="text-[11px] text-emerald-800 font-bold mt-1">
                  Margin: {overallMarginPct}%
                </p>
              </div>

              <div className="bg-rose-50/50 border border-rose-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex items-center justify-between text-rose-800 text-[11px] font-semibold uppercase tracking-wider">
                  <span>Total Expenses</span>

            {activeTab === 'ledger' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-6 space-y-4 shadow-sm">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-200">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <FileSpreadsheetIcon className="w-4 h-4 text-emerald-600" />
                      Overall Ledger (Combined 3 Sheets View)
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Consolidated master ledger matching purchases, sales, margins & PO IDs
                    </p>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-100 text-slate-600 text-[10px] uppercase font-mono font-bold">
                      <tr>
                        <th className="py-3 px-2 rounded-l-lg">SKU</th>
                        <th className="py-3 px-2">Pur Date</th>
                        <th className="py-3 px-2">Month</th>
                        <th className="py-3 px-2">PO ID</th>
                        <th className="py-3 px-2">Supplier Name</th>
                        <th className="py-3 px-2">Buyer Name</th>
                        <th className="py-3 px-2 text-right">Purchased Qty</th>
                        <th className="py-3 px-2 text-right">Sold Stock</th>
                        <th className="py-3 px-3 text-right">Purchase Value</th>
                        <th className="py-3 px-2 text-right">Sale Value</th>
                        <th className="py-3 px-2 text-right">Margin (₹)</th>
                        <th className="py-3 px-2 text-center rounded-r-lg">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {supplierInventory.map((item) => {
                        const primaryBuyer = item.matchedSales.length > 0 ? item.matchedSales[0].buyer : '-';
                        return (
                          <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                            <td className="py-3 px-2 font-bold text-amber-700 font-sans">{item.sku}</td>
                            <td className="py-3 px-2 text-slate-600">{item.date}</td>
                            <td className="py-3 px-2 text-slate-500">{item.month}</td>
                            <td className="py-3 px-2 text-emerald-700 font-bold">{item.poId && item.poId.trim() !== '' ? item.poId : '-'}</td>
                            <td className="py-3 px-2 font-sans font-semibold text-slate-900">{item.supplier}</td>
                            <td className="py-3 px-2 font-sans text-slate-700">{primaryBuyer}</td>
                            <td className="py-3 px-2 text-right font-bold text-slate-900">{formatQty(item.qty)}</td>
                            <td className="py-3 px-2 text-right text-blue-600 font-bold">{formatQty(item.soldQty)}</td>
                            <td className="py-3 px-2 text-right">{formatCurrency(item.purValue)}</td>
                            <td className="py-3 px-2 text-right text-emerald-600 font-bold">{formatCurrency(item.saleValue)}</td>
                            <td className={`py-3 px-2 text-right font-bold ${Number(item.margin) >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                              {formatCurrency(item.margin)}
                            </td>
                            <td className="py-3 px-2 text-center font-sans">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                item.status === 'Paid' 
                                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                  : 'bg-amber-100 text-amber-800 border border-amber-200'
                              }`}>
                                {item.status}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
