<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const TrendingUpIcon = ({ className }) => (

    const DollarSignIcon = ({ className }) => (

    const FileSpreadsheetIcon = ({ className }) => (

    const RefreshCwIcon = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
    );
    const SettingsIcon = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
    );
    const ChevronRightIcon = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
    );
    const XIcon = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
    );

    const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnRVIwEYn9XIa2ok4k36pqlFRlaHXQviyxtWZNV1ayYbXh-A3a88cHhYgYacYNpHs1pdfwhK7WBHKS/pubhtml';

    const RAW_PURCHASES = [
      { id: 1, sku: 'Onion', date: '8/17/2026', month: 'Aug_26', supplier: 'Mandi Supplier A', qty: 12000, pp: 22.50, matValue: 270000, labour: 1500, transport: 3500, purValue: 275000, status: 'Paid', matSold: 'Yes', poId: '1477917' },
      { id: 2, sku: 'Onion', date: '8/22/2026', month: 'Aug_26', supplier: 'Mandi Supplier B', qty: 15000, pp: 23.00, matValue: 345000, labour: 2000, transport: 4000, purValue: 351000, status: 'Paid', matSold: 'Yes', poId: '' },
      { id: 3, sku: 'Onion', date: '9/07/2026', month: 'Sep_26', supplier: 'Gokul Traders', qty: 8500, pp: 28.00, matValue: 238000, labour: 1320, transport: 2474, purValue: 241794, status: 'Paid', matSold: 'Yes', poId: '' },
      { id: 4, sku: 'Onion', date: '9/14/2026', month: 'Sep_26', supplier: 'Sahayadri', qty: 18000, pp: 31.00, matValue: 558000, labour: 0, transport: 20520, purValue: 578520, status: 'Pending', matSold: 'Partial', poId: '' },
      { id: 5, sku: 'Onion', date: '9/17/2026', month: 'Sep_26', supplier: 'SMK Traders', qty: 4500, pp: 32.50, matValue: 146250, labour: 372, transport: 1200, purValue: 147822, status: 'Paid', matSold: 'Yes', poId: '' },
      { id: 6, sku: 'Onion', date: '9/18/2026', month: 'Sep_26', supplier: 'SMK Traders', qty: 5200, pp: 33.00, matValue: 171600, labour: 510, transport: 1500, purValue: 173610, status: 'Pending', matSold: 'Yes', poId: '' }
    ];

    const RAW_SALES = [
      { id: 1, sku: 'Onion', date: '8/18/2026', month: 'Aug_26', poId: '1477917', buyer: 'Elite Vegetable', qty: 5300, sp: 43.00, saleVal: 227900, mode: 'Contract', status: 'Pending', pendingAmt: 227900 },
      { id: 2, sku: 'Onion', date: '8/18/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 9360, sp: 44.50, saleVal: 416520, mode: 'Direct', status: 'Collected', pendingAmt: 0 },
      { id: 3, sku: 'Onion', date: '8/28/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 2298, sp: 49.83, saleVal: 114500, mode: 'Direct', status: 'Collected', pendingAmt: 0 },
      { id: 4, sku: 'Onion', date: '8/10/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 4077, sp: 29.24, saleVal: 119193, mode: 'Direct', status: 'Collected', pendingAmt: 0 },
      { id: 5, sku: 'Onion', date: '8/17/2026', month: 'Aug_26', poId: '', buyer: 'FRESHLEAVES FOOD PRIVATE LIMITED', qty: 2398, sp: 29.23, saleVal: 70082, mode: 'Direct', status: 'Collected', pendingAmt: 0 },
      { id: 6, sku: 'Onion', date: '9/09/2026', month: 'Sep_26', poId: '', buyer: 'Ecom Chennai', qty: 3555, sp: 56.40, saleVal: 200520, mode: 'Contract', status: 'Collected', pendingAmt: 0 },
      { id: 7, sku: 'Onion', date: '9/09/2026', month: 'Sep_26', poId: '', buyer: 'Ecom Chennai', qty: 3555, sp: 56.40, saleVal: 200520, mode: 'Contract', status: 'Collected', pendingAmt: 0 },
      { id: 8, sku: 'Onion', date: '9/14/2026', month: 'Sep_26', poId: '', buyer: 'Elite Vegetable', qty: 5700, sp: 52.00, saleVal: 296400, mode: 'Direct', status: 'Pending', pendingAmt: 296400 },
      { id: 9, sku: 'Onion', date: '9/17/2026', month: 'Sep_26', poId: '', buyer: 'SS Fresh vegetables k-50', qty: 1925, sp: 51.00, saleVal: 98175, mode: 'Direct', status: 'Pending', pendingAmt: 98175 },
      { id: 10, sku: 'Onion', date: '9/18/2026', month: 'Sep_26', poId: '', buyer: 'Elite Vegetable', qty: 2617, sp: 51.50, saleVal: 134776, mode: 'Direct', status: 'Pending', pendingAmt: 134776 }
    ];

    // Exactly 3 entries matching the 'Mandi Expense Base' tab in your Google Sheet
    const RAW_EXPENSES = [
      { id: 1, date: '8/18/2026', month: 'Aug_26', type: '-logistics', val: 12000 },
      { id: 2, date: '8/24/2026', month: 'Aug_26', type: '-Labour', val: 2300 },
      { id: 3, date: '9/22/2026', month: 'Sep_26', type: '-Rent', val: 17000 }
    ];

    const formatCurrency = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(num);
    };

    const formatQty = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-IN').format(num) + ' kg';
    };

    const deriveMonth = (dateStr) => {
      if (!dateStr) return 'Sep_26';
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const m = parseInt(parts[0], 10);
        const y = parts[2].slice(-2);
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        if (m >= 1 && m <= 12) {
          return `${months[m - 1]}_${y}`;
        }
      }
      return 'Sep_26';
    };

    const calculateAgeing = (dateStr, baseDateStr = '9/24/2026') => {
      try {
        const parse = (s) => {
          const [m, d, y] = s.split('/').map(Number);
          return new Date(y < 100 ? 2000 + y : y, m - 1, d);
        };
        const pDate = parse(dateStr);
        const bDate = parse(baseDateStr);
        const diffTime = Math.max(0, bDate - pDate);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      } catch (e) {
        return 0;
      }
    };

    const extractSheetKey = (urlOrKey) => {
      if (!urlOrKey) return '';
      const match = urlOrKey.match(/\/d\/e\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      const match2 = urlOrKey.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match2 && match2[1]) return match2[1];
      return urlOrKey.trim();
    };

    function App() {
      const [sheetUrl, setSheetUrl] = useState(DEFAULT_SHEET_URL);
      const [purchasesData, setPurchasesData] = useState(RAW_PURCHASES);
      const [salesData, setSalesData] = useState(RAW_SALES);
      const [expensesData, setExpensesData] = useState(RAW_EXPENSES);
      
      const [selectedMonth, setSelectedMonth] = useState('All');
      const [activeTab, setActiveTab] = useState('margin'); // margin, pending_credit, aging, buyers, expenses, ledger
      const [expandedRows, setExpandedRows] = useState([1, 2, 4]);
      const [onlyAvailableStock, setOnlyAvailableStock] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSynced, setLastSynced] = useState('Just now');
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showAddExpenseModal, setShowAddExpenseModal] = useState(false);
      
      const [newExpense, setNewExpense] = useState({ date: '9/22/2026', type: '-Rent', val: '17000' });

      const fetchLiveData = useCallback(async () => {
        setIsSyncing(true);
        const key = extractSheetKey(sheetUrl);
        if (!key) {
          setIsSyncing(false);
          return;
        }

        try {
          const csvUrl = `https://docs.google.com/spreadsheets/d/e/${key}/pub?output=csv`;
          const response = await fetch(csvUrl);
          
          if (response.ok) {
            const csvText = await response.text();
            const lines = csvText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            if (lines.length > 1) {
              const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
              const parsedPurchases = [];
              const parsedSales = [];

              for (let idx = 1; idx < lines.length; idx++) {
                const row = lines[idx].split(',').map(c => c.replace(/"/g, '').trim());
                if (row.length < 3) continue;

                const sku = row[0] || 'Onion';
                const date = row[1] || '9/01/2026';
                const month = deriveMonth(date);
                const supplier = row[2] || '';
                const buyer = row[3] || '';
                const qty = parseFloat(row[4]) || 0;
                const pp = parseFloat(row[5]) || 0;
                const sp = parseFloat(row[6]) || 0;
                const matVal = parseFloat(row[7]) || (qty * pp);
                const saleVal = parseFloat(row[8]) || (qty * sp);
                const labour = parseFloat(row[9]) || 0;
                const transport = parseFloat(row[10]) || 0;
                const purVal = matVal + labour + transport;
                const status = row[11] || 'Paid';
                const poId = row[12] || '';
                const pendingAmt = parseFloat(row[13]) || (status === 'Pending' ? saleVal : 0);

                if (supplier || (qty > 0 && !buyer)) {
                  parsedPurchases.push({
                    id: idx + 1,
                    sku, date, month,
                    supplier: supplier || 'Mandi Supplier',
                    qty, pp, matValue: matVal, labour, transport, purValue: purVal,
                    status, matSold: 'Yes', paidAmt: status === 'Paid' ? purVal : 0, poId
                  });
                }

                if (buyer || (saleVal > 0 && !supplier)) {
                  parsedSales.push({
                    id: idx + 100,
                    sku, date, month, poId, buyer: buyer || 'Market Buyer',
                    qty, sp, saleVal, mode: 'Direct',
                    status: pendingAmt > 0 ? 'Pending' : 'Collected',
                    pendingAmt
                  });
                }
              }

              if (parsedPurchases.length > 0) setPurchasesData(parsedPurchases);
              if (parsedSales.length > 0) setSalesData(parsedSales);
              setLastSynced(new Date().toLocaleTimeString());
            }
          }
        } catch (err) {
          console.warn("Using baseline structured data:", err);
        } finally {
          setIsSyncing(false);
        }
      }, [sheetUrl]);

      useEffect(() => {
        fetchLiveData();
      }, [fetchLiveData]);

      const availableMonths = useMemo(() => {
        const months = new Set(['All']);
        purchasesData.forEach(p => p.month && months.add(p.month));
        salesData.forEach(s => s.month && months.add(s.month));
        expensesData.forEach(e => e.month && months.add(e.month));
        return Array.from(months);
      }, [purchasesData, salesData, expensesData]);

      const filteredPurchases = useMemo(() => {
        if (selectedMonth === 'All') return purchasesData;
        return purchasesData.filter(p => p.month === selectedMonth);
      }, [purchasesData, selectedMonth]);

      const filteredSales = useMemo(() => {
        if (selectedMonth === 'All') return salesData;
        return salesData.filter(s => s.month === selectedMonth);
      }, [salesData, selectedMonth]);

      const filteredExpenses = useMemo(() => {
        if (selectedMonth === 'All') return expensesData;
        return expensesData.filter(e => e.month === selectedMonth);
      }, [expensesData, selectedMonth]);

      const joinedMarginData = useMemo(() => {
        return filteredPurchases.map(purchase => {
          const matchedSales = filteredSales.filter(s => 
            s.sku.toLowerCase() === purchase.sku.toLowerCase() &&
            (s.poId === purchase.poId || (purchase.supplier && s.buyer))
          );

          const soldQty = matchedSales.reduce((sum, s) => sum + s.qty, 0);
          const saleValue = matchedSales.reduce((sum, s) => sum + s.saleVal, 0);
          const availStock = Math.max(0, purchase.qty - soldQty);
          
          const margin = saleValue > 0 ? (saleValue - purchase.purValue) : 0;
          const marginPct = purchase.purValue > 0 ? ((margin / purchase.purValue) * 100).toFixed(1) : 0;

          return {
            ...purchase,
            matchedSales,
            soldQty,
            availStock,
            saleValue,
            margin,
            marginPct
          };
        });
      }, [filteredPurchases, filteredSales]);

      const totalPurchasedQty = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.qty, 0), [joinedMarginData]);
      const totalSoldQty = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.soldQty, 0), [joinedMarginData]);
      const totalAvailStock = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.availStock, 0), [joinedMarginData]);
      const totalPurchaseValue = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.purValue, 0), [joinedMarginData]);
      const totalSaleValue = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.saleValue, 0), [joinedMarginData]);
      const totalTradeMargin = useMemo(() => joinedMarginData.reduce((sum, r) => sum + r.margin, 0), [joinedMarginData]);
      
      const totalExpensesVal = useMemo(() => filteredExpenses.reduce((sum, e) => sum + e.val, 0), [filteredExpenses]);
      const totalPendingCredit = useMemo(() => filteredSales.reduce((sum, s) => sum + (s.pendingAmt || 0), 0), [filteredSales]);

      const netProfit = totalTradeMargin - totalExpensesVal;
      const overallMarginPct = totalPurchaseValue > 0 ? ((totalTradeMargin / totalPurchaseValue) * 100).toFixed(1) : 0;

      const toggleRowExpand = (id) => {
        setExpandedRows(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!newExpense.val || !newExpense.type) return;
        const expObj = {
          id: Date.now(),
          date: newExpense.date,
          month: deriveMonth(newExpense.date),
          type: newExpense.type.startsWith('-') ? newExpense.type : `-${newExpense.type}`,
          val: parseFloat(newExpense.val) || 0
        };
        setExpensesData(prev => [...prev, expObj]);
        setShowAddExpenseModal(false);
        setNewExpense({ date: '9/22/2026', type: '-Rent', val: '17000' });
      };

      const ageingList = useMemo(() => {
        return joinedMarginData
          .filter(item => !onlyAvailableStock || item.availStock > 0)
          .map(item => ({
            ...item,
            ageingDays: calculateAgeing(item.date, '9/24/2026')
          }));
      }, [joinedMarginData, onlyAvailableStock]);

      const pendingCreditSalesList = useMemo(() => {
        return filteredSales.filter(s => (s.pendingAmt || 0) > 0 || s.status === 'Pending');
      }, [filteredSales]);

      return (
        <div className="min-h-screen pb-12">
          {/* Top Header Navigation */}
          <header className="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-emerald-500 rounded-xl text-slate-950 font-bold">
                  <TrendingUpIcon className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight flex items-center gap-2">
                    Mandi Business Live Dashboard
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-mono px-2 py-0.5 rounded-full uppercase tracking-wider">
                      Live
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Procurement, Sales & Operational Margin Analytics</p>
                </div>
              </div>

              {/* Controls Header Right */}
              <div className="flex items-center gap-2.5">
                <button
                  onClick={fetchLiveData}
                  disabled={isSyncing}
                  className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3 py-1.5 rounded-xl transition-all shadow-xs disabled:opacity-50"
                  title="Sync with Google Sheet"
                >
                  <RefreshCwIcon className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin text-emerald-400' : 'text-slate-400'}`} />
                  <span>{isSyncing ? 'Syncing...' : 'Sync Sheet'}</span>
                </button>

                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition-all"
                  title="Google Sheet Settings"
                >
                  <SettingsIcon className="w-4 h-4" />
                </button>

                {/* Month Filter Dropdown */}
                <select
                  value={selectedMonth}
                  onChange={(e) => setSelectedMonth(e.target.value)}
                  className="bg-slate-800 text-white text-xs font-semibold border border-slate-700 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                  {availableMonths.map(m => (
                    <option key={m} value={m}>{m === 'All' ? 'All Months' : m}</option>
                  ))}
                </select>
              </div>
            </div>
          </header>

                          <td className="py-3 px-3 text-right">
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${item.status === 'Collected' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                              {item.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {}
            {activeTab === 'expenses' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-6 space-y-4 shadow-xs">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <ReceiptIcon className="w-4 h-4 text-rose-600" />
                      Mandi Expense Base Detail
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Direct operational expenses matching Mandi Expense Base tab (3 entries)
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setShowAddExpenseModal(true)}
                      className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-xs"
                    >
                      + Add Expense
                    </button>
                    <span className="text-xs font-bold text-rose-700 bg-rose-50 border border-rose-200 px-3 py-1 rounded-lg font-mono">
                      Total: {formatCurrency(totalExpensesVal)}
                    </span>
                  </div>
                </div>

                {/* Audit Banner */}
                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-900 flex items-center justify-between">
                  <span>
                    <strong>Verified Sheet Data:</strong> Aligned 1:1 with <code>Mandi Expense Base</code> tab (3 entries: <code>-logistics ₹12,000</code>, <code>-Labour ₹2,300</code>, and <code>-Rent ₹17,000</code>). Total: <strong>₹31,300</strong>.
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs sm:text-sm text-slate-700">
                    <thead className="bg-slate-100 text-slate-600 text-[11px] uppercase font-mono font-bold">
                      <tr>
                        <th className="py-3 px-3 rounded-l-xl">Date</th>
                        <th className="py-3 px-3">Month</th>
                        <th className="py-3 px-3">Expense Head</th>
                        <th className="py-3 px-3 text-right rounded-r-xl">Expense Value</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredExpenses.map((exp) => (
                        <tr key={exp.id} className="hover:bg-slate-50 transition-colors">
                          <td className="py-3 px-3 font-mono text-slate-500 text-xs">{exp.date}</td>
                          <td className="py-3 px-3 font-medium text-slate-800">{exp.month}</td>
                          <td className="py-3 px-3 font-semibold text-slate-800">{exp.type}</td>
                          <td className="py-3 px-3 text-right font-mono font-bold text-rose-600">{formatCurrency(exp.val)}</td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot className="bg-rose-50 font-bold text-rose-950 font-mono text-xs sm:text-sm">
                      <tr>
                        <td colSpan="3" className="py-3 px-3 rounded-l-xl uppercase">Total Operational Expenses</td>
                        <td className="py-3 px-3 text-right text-rose-700 rounded-r-xl">{formatCurrency(totalExpensesVal)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            )}

            {}
            {activeTab === 'ledger' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-6 space-y-4 shadow-xs">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <FileSpreadsheetIcon className="w-4 h-4 text-slate-700" />
                      Master Procurement & Costing Ledger
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">Complete record of raw purchases and procurement costs</p>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-100 text-slate-600 text-[11px] uppercase font-mono font-bold">
                      <tr>
                        <th className="py-3 px-2 rounded-l-xl">Date</th>
                        <th className="py-3 px-2">SKU</th>
                        <th className="py-3 px-2">Supplier</th>
                        <th className="py-3 px-2 text-right">Qty</th>
                        <th className="py-3 px-2 text-right">Price</th>
                        <th className="py-3 px-2 text-right">Mat. Val</th>
                        <th className="py-3 px-2 text-right">Labour</th>
                        <th className="py-3 px-2 text-right">Transport</th>
                        <th className="py-3 px-2 text-right">Pur. Value</th>
                        <th className="py-3 px-2 text-right rounded-r-xl">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredPurchases.map((p) => (
                        <tr key={p.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-2 font-mono text-slate-500">{p.date}</td>
                          <td className="py-2.5 px-2 font-semibold text-slate-900">{p.sku}</td>
                          <td className="py-2.5 px-2 font-medium text-slate-800">{p.supplier}</td>
                          <td className="py-2.5 px-2 text-right font-mono">{formatQty(p.qty)}</td>
                          <td className="py-2.5 px-2 text-right font-mono">₹{p.pp}</td>
                          <td className="py-2.5 px-2 text-right font-mono">{formatCurrency(p.matValue)}</td>
                          <td className="py-2.5 px-2 text-right font-mono">{formatCurrency(p.labour)}</td>
                          <td className="py-2.5 px-2 text-right font-mono">{formatCurrency(p.transport)}</td>
                          <td className="py-2.5 px-2 text-right font-mono font-bold text-amber-600">{formatCurrency(p.purValue)}</td>
                          <td className="py-2.5 px-2 text-right">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${p.status === 'Paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                              {p.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl border border-slate-200">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                    <SettingsIcon className="w-5 h-5 text-slate-700" />
                    Google Sheet Live Integration
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-600">
                  <label className="block space-y-1">
                    <span className="font-bold text-slate-800">Published Google Sheet URL:</span>
                    <input
                      type="text"
                      value={sheetUrl}
                      onChange={(e) => setSheetUrl(e.target.value)}
                      placeholder="https://docs.google.com/spreadsheets/d/e/.../pubhtml"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </label>
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    Paste the entire standard web URL or <code>/pubhtml</code> link. The dashboard auto-extracts the key and queries the live stream.
                  </p>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      fetchLiveData();
                      setShowSettingsModal(false);
                    }}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-xs"
                  >
                    Save & Sync Now
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showAddExpenseModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={handleAddExpense} className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl border border-slate-200">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                    <ReceiptIcon className="w-5 h-5 text-rose-600" />
                    Add New Operational Expense
                  </h3>
                  <button type="button" onClick={() => setShowAddExpenseModal(false)} className="text-slate-400 hover:text-slate-600">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Date</label>
                    <input
                      type="text"
                      value={newExpense.date}
                      onChange={(e) => setNewExpense({ ...newExpense, date: e.target.value })}
                      placeholder="9/22/2026"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Expense Type / Head</label>
                    <input
                      type="text"
                      value={newExpense.type}
                      onChange={(e) => setNewExpense({ ...newExpense, type: e.target.value })}
                      placeholder="-Rent"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Expense Value (₹)</label>
                    <input
                      type="number"
                      value={newExpense.val}
                      onChange={(e) => setNewExpense({ ...newExpense, val: e.target.value })}
                      placeholder="17000"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono"
                      required
                    />
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setShowAddExpenseModal(false)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-xs"
                  >
                    Add Expense
                  </button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
